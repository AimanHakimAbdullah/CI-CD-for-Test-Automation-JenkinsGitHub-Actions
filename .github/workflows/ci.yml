# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push request events but only for the "main" branch
  push:
    branches: [ "main" ]

  # Triggers on pull requests targeting "main" (needed for the coverage PR comment)
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Needed by dorny/test-reporter to publish check runs
permissions:
  contents: read
  checks: write

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "unit-tests-backend"
  unit-tests-backend:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Sets up a Go environment for use in actions by adding it to the PATH
      - name: Set up Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: bugtracker-backend/go.sum

      - name: Run backend unit tests
        working-directory: ./bugtracker-backend
        run: |
              mkdir -p reports
              # Keep the test exit code so reports are still generated on failure
              set +e
              go test -v -coverprofile=coverage.out ./... 2>&1 | tee test.log
              status=${PIPESTATUS[0]}
              set -e

              # JUnit XML + HTML coverage, like the Jenkins pipeline
              go install github.com/jstemmer/go-junit-report/v2@v2.1.0
              "$(go env GOPATH)/bin/go-junit-report" < test.log > reports/report.xml
              go tool cover -html=coverage.out -o reports/coverage.html

              # Show total coverage on the run summary page
              echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
              go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

              # Markdown snippet used by the "coverage-comment" job
              {
                echo "### Backend (Go)"
                echo "**Total coverage:** $(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')"
                echo
                echo "<details><summary>Per-function coverage</summary>"
                echo
                echo '```'
                go tool cover -func=coverage.out
                echo '```'
                echo "</details>"
              } > reports/coverage-comment.md

              exit $status

      - name: Upload backend report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-report
          path: bugtracker-backend/reports/

      - name: Publish backend test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Unit Tests Report
          path: bugtracker-backend/reports/report.xml
          reporter: java-junit
          use-actions-summary: false

  # This workflow contains a single job called "unit-tests-frontend"
  unit-tests-frontend:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Sets up a Node.js environment for use in actions by adding it to the PATH
      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: bugtracker-frontend/package-lock.json

      - name: Run frontend unit tests
        working-directory: ./bugtracker-frontend
        run: |
              npm ci

              # Keep the test exit code so reports are still collected on failure
              set +e
              # Extra json-summary reporter gives machine-readable totals for the PR comment
              npm test -- --coverageReporters=json-summary
              status=$?
              set -e

              # Gather JUnit XML and coverage output for upload
              rm -rf reports
              mkdir -p reports
              mv test-results.xml reports/test-results.xml
              mv coverage reports/coverage

              # Markdown snippet used by the "coverage-comment" job
              node -e '
                const t = require("./reports/coverage/coverage-summary.json").total;
                const row = k => `| ${k} | ${t[k].pct}% (${t[k].covered}/${t[k].total}) |`;
                console.log([
                  "### Frontend (Jest)", "",
                  "| Metric | Coverage |", "|---|---|",
                  ...["lines", "statements", "functions", "branches"].map(row),
                ].join("\n"));
              ' > reports/coverage-comment.md

              exit $status

      - name: Upload frontend report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-report
          path: bugtracker-frontend/reports/

      - name: Publish frontend test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Frontend Unit Tests Report
          path: bugtracker-frontend/reports/test-results.xml
          reporter: jest-junit
          use-actions-summary: false

  # Posts (or updates) one coverage comment on the pull request
  coverage-comment:
    # Run even if tests failed, but only for pull requests
    if: always() && github.event_name == 'pull_request'
    needs: [unit-tests-backend, unit-tests-frontend]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      # Downloads every artifact of this run into reports/<artifact-name>/
      - uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Build coverage comment
        run: |
          {
            echo "## Unit test coverage"
            echo
            cat reports/backend-report/coverage-comment.md 2>/dev/null || echo "_Backend coverage not available_"
            echo
            cat reports/frontend-report/coverage-comment.md 2>/dev/null || echo "_Frontend coverage not available_"
          } > coverage-comment.md

      # "header" makes it a sticky comment: later pushes edit it instead of adding new ones
      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage-comment.md